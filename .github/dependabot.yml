# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/dot_pi/agent/extensions/sandbox"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/dot_pi/agent/skills/youtube-transcript"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/dot_pi/agent/skills/brave-search"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/dot_local/share/agent-skills/brave-search"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/dot_mcporter/playwright"
    schedule:
      interval: "weekly"
